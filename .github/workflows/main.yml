
name: Build Part 7 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Part 7/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        working-directory: Part 7
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Friday-AI-APK
          path: 'Part 7/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
